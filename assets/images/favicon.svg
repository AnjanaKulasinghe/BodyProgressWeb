<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9F1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Chart/Progress Icon -->
  <!-- Base bars -->
  <rect x="100" y="300" width="80" height="140" rx="8" fill="url(#brandGradient)" opacity="0.6"/>
  <rect x="216" y="220" width="80" height="220" rx="8" fill="url(#brandGradient)" opacity="0.8"/>
  <rect x="332" y="160" width="80" height="280" rx="8" fill="url(#brandGradient)"/>
  
  <!-- Trend line overlay -->
  <path d="M 140 340 L 256 260 L 372 200" stroke="#1B98E0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="140" cy="340" r="12" fill="#1B98E0"/>
  <circle cx="256" cy="260" r="12" fill="#1B98E0"/>
  <circle cx="372" cy="200" r="12" fill="#1B98E0"/>
</svg>
